<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- title -->
  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="bold">IAOS Pipeline — Workflow sketch</text>
  <text x="500" y="48" text-anchor="middle" fill="#666">Grupo 10 — IAOS 2026 (UPM)</text>

  <!-- ===== INPUT layer ===== -->
  <g>
    <rect x="40"  y="100" width="180" height="48" rx="6" fill="#e8f0fe" stroke="#4a6fa5"/>
    <text x="130" y="123" text-anchor="middle">papers_corpus.csv</text>
    <text x="130" y="140" text-anchor="middle" font-size="11" fill="#555">30 DOIs</text>

    <rect x="40"  y="170" width="180" height="48" rx="6" fill="#e8f0fe" stroke="#4a6fa5"/>
    <text x="130" y="193" text-anchor="middle">data/pdfs/*.pdf</text>
    <text x="130" y="210" text-anchor="middle" font-size="11" fill="#555">30 PDFs</text>
  </g>

  <!-- ===== STEP boxes ===== -->
  <g font-size="12">
    <!-- 01 -->
    <rect x="290" y="90"  width="200" height="50" rx="6" fill="#fff2cc" stroke="#a48230"/>
    <text x="390" y="110" text-anchor="middle" font-weight="bold">01 fetch_metadata</text>
    <text x="390" y="128" text-anchor="middle" font-size="11">OpenAlex API</text>

    <!-- 02 -->
    <rect x="290" y="160" width="200" height="50" rx="6" fill="#fff2cc" stroke="#a48230"/>
    <text x="390" y="180" text-anchor="middle" font-weight="bold">02 extract_software</text>
    <text x="390" y="198" text-anchor="middle" font-size="11">Grobid + ML/NER + URLs</text>

    <!-- 03 -->
    <rect x="290" y="230" width="200" height="50" rx="6" fill="#fff2cc" stroke="#a48230"/>
    <text x="390" y="250" text-anchor="middle" font-weight="bold">03 enrich_orgs_ror</text>
    <text x="390" y="268" text-anchor="middle" font-size="11">ROR API (canonical IDs)</text>

    <!-- 04 -->
    <rect x="290" y="300" width="200" height="50" rx="6" fill="#fff2cc" stroke="#a48230"/>
    <text x="390" y="320" text-anchor="middle" font-weight="bold">04 topic_modeling</text>
    <text x="390" y="338" text-anchor="middle" font-size="11">BERTopic (thr=0.30)</text>

    <!-- 05 -->
    <rect x="290" y="370" width="200" height="50" rx="6" fill="#fff2cc" stroke="#a48230"/>
    <text x="390" y="390" text-anchor="middle" font-weight="bold">05 similarity</text>
    <text x="390" y="408" text-anchor="middle" font-size="11">cosine MiniLM (thr=0.70)</text>

    <!-- 06 -->
    <rect x="290" y="440" width="200" height="50" rx="6" fill="#fff2cc" stroke="#a48230"/>
    <text x="390" y="460" text-anchor="middle" font-weight="bold">06 ner_acknowledgements</text>
    <text x="390" y="478" text-anchor="middle" font-size="11">roberta-large-ner (thr=0.85)</text>
  </g>

  <!-- ===== CENTRAL build_kg ===== -->
  <g>
    <rect x="560" y="240" width="220" height="80" rx="10" fill="#d5e8d4" stroke="#3a7d3a" stroke-width="2"/>
    <text x="670" y="265" text-anchor="middle" font-weight="bold" font-size="14">07 build_kg</text>
    <text x="670" y="285" text-anchor="middle" font-size="11">rdflib + n-ary patterns</text>
    <text x="670" y="302" text-anchor="middle" font-size="11" fill="#555">Affiliation · TopicAssignment</text>
    <text x="670" y="316" text-anchor="middle" font-size="11" fill="#555">SimilarityRelation</text>
  </g>

  <!-- ===== Outputs ===== -->
  <g>
    <rect x="830" y="140" width="140" height="46" rx="6" fill="#dae8fc" stroke="#3c5b87"/>
    <text x="900" y="162" text-anchor="middle" font-weight="bold">kg.ttl</text>
    <text x="900" y="178" text-anchor="middle" font-size="11">RDF Knowledge Graph</text>

    <rect x="830" y="200" width="140" height="46" rx="6" fill="#dae8fc" stroke="#3c5b87"/>
    <text x="900" y="222" text-anchor="middle" font-weight="bold">08 prov.ttl</text>
    <text x="900" y="238" text-anchor="middle" font-size="11">PROV-O trace</text>

    <rect x="830" y="260" width="140" height="46" rx="6" fill="#dae8fc" stroke="#3c5b87"/>
    <text x="900" y="282" text-anchor="middle" font-weight="bold">09 SHACL</text>
    <text x="900" y="298" text-anchor="middle" font-size="11">validation report</text>

    <rect x="830" y="320" width="140" height="46" rx="6" fill="#dae8fc" stroke="#3c5b87"/>
    <text x="900" y="342" text-anchor="middle" font-weight="bold">10 RO-Crate</text>
    <text x="900" y="358" text-anchor="middle" font-size="11">packaged experiment</text>

    <rect x="830" y="400" width="140" height="60" rx="6" fill="#f5d3d3" stroke="#a14242"/>
    <text x="900" y="423" text-anchor="middle" font-weight="bold">Fuseki</text>
    <text x="900" y="440" text-anchor="middle" font-size="11">SPARQL endpoint</text>
    <text x="900" y="455" text-anchor="middle" font-size="11">localhost:3030</text>
  </g>

  <!-- ===== EDGES ===== -->
  <g fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)">
    <!-- defs marker -->
  </g>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- inputs → steps -->
  <line x1="220" y1="124" x2="290" y2="115" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="220" y1="190" x2="290" y2="185" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="220" y1="200" x2="290" y2="460" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 01 -> 03 (openalex.json feeds enrich) -->
  <line x1="390" y1="140" x2="390" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="390" y1="210" x2="390" y2="230" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="390" y1="280" x2="390" y2="300" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="390" y1="350" x2="390" y2="370" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="390" y1="420" x2="390" y2="440" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- all steps -> build_kg -->
  <line x1="490" y1="115" x2="560" y2="265" stroke="#888" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arr)"/>
  <line x1="490" y1="185" x2="560" y2="270" stroke="#888" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arr)"/>
  <line x1="490" y1="255" x2="560" y2="275" stroke="#888" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arr)"/>
  <line x1="490" y1="325" x2="560" y2="290" stroke="#888" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arr)"/>
  <line x1="490" y1="395" x2="560" y2="300" stroke="#888" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arr)"/>
  <line x1="490" y1="465" x2="560" y2="310" stroke="#888" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arr)"/>

  <!-- build_kg -> outputs -->
  <line x1="780" y1="265" x2="830" y2="165" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="780" y1="278" x2="830" y2="225" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="780" y1="290" x2="830" y2="283" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="780" y1="305" x2="830" y2="345" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="900" y1="186" x2="900" y2="400" stroke="#3c5b87" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#arr)"/>

  <!-- ===== Legend ===== -->
  <g transform="translate(40, 560)">
    <text x="0" y="0" font-weight="bold">Legend</text>
    <rect x="0"  y="15" width="22" height="16" fill="#e8f0fe" stroke="#4a6fa5"/>
    <text x="30" y="28">inputs</text>
    <rect x="100" y="15" width="22" height="16" fill="#fff2cc" stroke="#a48230"/>
    <text x="130" y="28">pipeline step (1 Python script)</text>
    <rect x="350" y="15" width="22" height="16" fill="#d5e8d4" stroke="#3a7d3a"/>
    <text x="380" y="28">central KG builder (n-ary patterns)</text>
    <rect x="600" y="15" width="22" height="16" fill="#dae8fc" stroke="#3c5b87"/>
    <text x="630" y="28">generated artifact (RDF)</text>
    <rect x="800" y="15" width="22" height="16" fill="#f5d3d3" stroke="#a14242"/>
    <text x="830" y="28">runtime service</text>
  </g>

  <g transform="translate(40, 620)">
    <text x="0" y="0" font-weight="bold">Thresholds (materialized in the KG as n-ary attributes)</text>
    <text x="0" y="20">• topic_prob_threshold = 0.30  → iaos:topicThreshold on every TopicAssignment</text>
    <text x="0" y="36">• similarity_threshold = 0.70  → iaos:similarityThreshold on every SimilarityRelation</text>
    <text x="0" y="52">• ner_score_threshold   = 0.85 → applied at extraction time (not stored)</text>
  </g>
</svg>
